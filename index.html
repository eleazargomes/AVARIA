<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orçamentos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:#f4f7f6;color:#333;display:flex;flex-direction:column;min-height:100vh}
header{background:#2c3e50;color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:1.5rem;font-weight:700}nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;font-weight:500;cursor:pointer}nav a:hover,nav a.on{color:#3498db}
main{flex:1;padding:2rem;max-width:1100px;width:100%;margin:0 auto}
footer{background:#2c3e50;color:#fff;text-align:center;padding:1rem;font-size:.9rem}
h1{font-size:1.9rem;color:#2c3e50}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;flex-wrap:wrap;gap:10px}
.card{background:#fff;padding:1.5rem;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.05);margin-bottom:1.2rem}
.card h2{font-size:1.15rem;color:#2c3e50;margin-bottom:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;align-items:end}
label{display:block;font-size:.88rem;color:#2c3e50;font-weight:600;margin:.6rem 0 .3rem}
input,select,textarea{width:100%;padding:.65rem;border:1px solid #ccc;border-radius:6px;font-size:.95rem;background:#fff}
textarea{min-height:100px}input:focus,select:focus,textarea:focus{outline:0;border-color:#3498db}
.btn{display:inline-block;padding:.65rem 1.2rem;background:#2c3e50;color:#fff;border:0;border-radius:6px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.9rem}
.btn:hover{background:#3498db}.az{background:#3498db}.vd{background:#27ae60}.vm{background:#e74c3c}.cz{background:#e0e0e0;color:#555}.sm{padding:.3rem .65rem;font-size:.78rem}
.tc{background:#fff;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.05);overflow-x:auto;margin-bottom:1.2rem}
table{width:100%;border-collapse:collapse}th,td{padding:.8rem 1rem;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}
th{background:#f8f9fa;color:#2c3e50;font-size:.8rem;text-transform:uppercase}
.badge{display:inline-block;padding:.2rem .65rem;border-radius:50px;font-size:.78rem;font-weight:700}
.Aprovado{background:#e8f8f0;color:#27ae60}.Pendente,.sc{background:#fef9e7;color:#f39c12}.Rejeitado{background:#fde8e8;color:#e74c3c}.ok{background:#e8f4fc;color:#2980b9}
.pu{background:#f3e8fc;color:#8e44ad}.tot{text-align:right;margin:.8rem 0;font-size:1.1rem}.tot b{color:#27ae60;font-size:1.5rem}
.chk{display:flex;flex-wrap:wrap;gap:.3rem 1rem}.chk label{font-weight:400;margin:0;display:flex;gap:.3rem;align-items:center}.chk input{width:auto}
.acts{display:flex;justify-content:flex-end;gap:.8rem;margin-top:1rem}.m{color:#777;font-size:.85rem}
.lg{max-width:380px;margin:12vh auto}.lg h2{text-align:center;margin-bottom:1rem}
</style></head><body>
<header><div class="logo">Meu Site</div><nav id="nav"></nav></header>
<main id="app">Carregando...</main>
<footer>&copy; 2026 Meu Site. Todos os direitos reservados. · v10 (Supabase)</footer>
<script>
// Supabase: Project Settings > API (URL do projeto e chave anon/public)
const SB_URL='COLE_AQUI_A_URL_DO_PROJETO',SB_KEY='COLE_AQUI_A_CHAVE_ANON';
const SET=['Operação','Manutenção','Suprimentos','Líder','Administração'];
const TIPOS=['Transporte de Cargas','Entrega Urbana','Operação de Campo']; // edite aqui os tipos de serviço
const VEI=['Caminhão Volvo FH (ABC-1234)','Van Sprinter (XYZ-5678)','Fiat Fiorino (KLY-9012)','Scania R450 (DEF-3456)'];
const PG={orc:['orcamentos','Orçamentos'],novo:['novo','Novo Orçamento'],sup:['suprimentos','Suprimentos'],mat:['materiais','Materiais & Horas'],usu:['usuarios','Usuários']};
let U=null;try{U=JSON.parse(localStorage.getItem('u'))}catch(e){}
const $=id=>document.getElementById(id);
const can=k=>!!U&&(U.papel==='admin'||(U.permissoes||[]).includes(k));
const brl=n=>'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(a,p)=>(p?`<option value="">${p}</option>`:'')+a.map(x=>`<option>${esc(x)}</option>`).join('');
const bd=s=>`<span class="badge ${s}">${s}</span>`;
function logout(){cl();try{sb.auth.signOut()}catch(e){}localStorage.removeItem('u');U=null;location.hash='';render()}
const RD=['listarOrcamentos','getOrcamento','listarMateriais','listarUsuarios'],CH={},cl=()=>{for(const x in CH)delete CH[x]};
async function api(a,d){ // leituras ficam 30s em memória; qualquer gravação limpa o cache
  const k=a+JSON.stringify(d||{});
  if(RD.includes(a)){const c=CH[k];if(c&&Date.now()-c.t<30000)return JSON.parse(c.v)}
  const v=await apiRaw(a,d);
  if(RD.includes(a))CH[k]={t:Date.now(),v:JSON.stringify(v)};else if(a!=='login')cl();
  return v}
let SBO=SB_URL.trim();try{SBO=new URL(SBO).origin}catch(e){} // remove barras/caminhos extras colados por engano
const sb=supabase.createClient(SBO,SB_KEY.trim());
let booted=false;
const DOM='@orcamentos.local',ORC=n=>'ORC-'+String(n).padStart(3,'0'),num=s=>+String(s).replace(/\D/g,'');
const PERM={'Operação':['novo','orcamentos'],'Manutenção':['orcamentos','dimensionar'],'Suprimentos':['orcamentos','suprimentos'],'Líder':['orcamentos','dimensionar']};
const NAVS={'Operação':['orc'],'Manutenção':['orc'],'Líder':['orc'],'Suprimentos':['sup']},SUB={orc:['orc','ver','dim','novo'],sup:['sup']};
const VAL=()=>!!U&&(U.papel==='admin'||U.setor==='Líder');
const DEF=()=>U.papel==='admin'?'home':(NAVS[U.setor]||['orc'])[0];
const allowed=r=>U.papel==='admin'||(NAVS[U.setor]||[]).some(k=>(SUB[k]||[]).includes(r));
const perms=p=>p.papel==='admin'?['orcamentos','novo','dimensionar','suprimentos','materiais','usuarios']:(PERM[p.setor]||[]);
function ok(r){if(r.error){let m=r.error.message||'Erro';
 if(/row-level security/i.test(m))m='Sem permissão para esta operação.';
 else if(/Invalid login/i.test(m))m='Usuário ou senha inválidos';
 else if(/multiple \(or no\) rows/i.test(m))m='Registro não encontrado ou sem permissão.';
 else if(/JWT|refresh/i.test(m)){setTimeout(logout);m='Sessão expirada';}
 else if(/fetch|network/i.test(m))m='Falha de conexão com o servidor (confira SB_URL e SB_KEY no index.html).';
 throw new Error(m)}return r.data}
const perfil=async id=>{const p=ok(await sb.from('profiles').select('*').eq('id',id).single());if(!p.ativo)throw new Error('Usuário inativo');
 return{id:p.id,nome:p.nome,login:p.login,setor:p.setor,tipoServico:p.tipo_servico,papel:p.papel,permissoes:perms(p)}};
async function boot(){booted=true;const {data}=await sb.auth.getSession();
 if(!data.session){U=null;localStorage.removeItem('u');return}
 try{U=await perfil(data.session.user.id);localStorage.setItem('u',JSON.stringify(U))}catch(e){U=null;localStorage.removeItem('u')}}
const orcMap=o=>({id:ORC(o.id),veiculo:o.veiculo,setor:'Operação',tipoServico:o.tipo_servico,status:o.status,total:+o.total});
const H={
 async login(d){const r=ok(await sb.auth.signInWithPassword({email:d.login.trim().toLowerCase()+DOM,password:d.senha}));
  try{const p=await perfil(r.user.id);booted=true;return p}catch(e){await sb.auth.signOut();throw e}},
 async listarOrcamentos(){return ok(await sb.from('orcamentos').select('id,veiculo,tipo_servico,status,total,itens(cotado)').order('id',{ascending:false}))
  .map(o=>({...orcMap(o),pend:o.itens.filter(i=>!i.cotado).length}))},
 async getOrcamento(d){const n=num(d.id);
  const [o,it]=await Promise.all([sb.from('orcamentos').select('*').eq('id',n).single(),sb.from('itens').select('*').eq('orcamento_id',n).order('id')]);
  const x=ok(o);return{orcamento:{...orcMap(x),descricao:x.descricao,solicitante:x.solicitante},
   itens:ok(it).map(i=>({id:i.id,categoria:i.categoria,origem:i.origem,descricao:i.descricao,qtd:+i.qtd,unitario:+i.unitario,cotado:i.cotado}))}},
 async listarMateriais(){return ok(await sb.from('materiais').select('*').order('tipo').order('nome')).map(m=>({id:m.id,tipo:m.tipo,nome:m.nome,unidade:m.unidade,valor:+m.valor}))},
 async salvarMaterial(d){ok(await sb.from('materiais').insert({tipo:d.tipo,nome:d.nome,unidade:d.unidade,valor:d.valor}));return true},
 async excluirMaterial(d){ok(await sb.from('materiais').delete().eq('id',d.id));return true},
 async salvarOrcamento(d){const r=ok(await sb.from('orcamentos').insert({veiculo:d.veiculo,tipo_servico:d.tipoServico,descricao:d.descricao}).select('id').single());return{id:ORC(r.id)}},
 async atualizarStatus(d){const r=ok(await sb.from('orcamentos').update({status:d.status}).eq('id',num(d.id)).select('id'));if(!r.length)throw new Error('Sem permissão para esta operação.');return true},
 async salvarItens(d){const n=num(d.id),cur=ok(await sb.from('itens').select('id').eq('orcamento_id',n)).map(x=>x.id),keep=d.itens.filter(i=>i.id).map(i=>i.id),del=cur.filter(x=>!keep.includes(x));
  if(del.length)ok(await sb.from('itens').delete().in('id',del));
  const add=d.itens.filter(i=>!i.id).map(i=>({orcamento_id:n,categoria:i.categoria||(i.origem==='Sem cadastro'?'Sem cadastro':'Material'),origem:i.origem,descricao:i.descricao,qtd:i.qtd,unitario:i.cotado?i.unitario:0,cotado:!!i.cotado}));
  if(add.length)ok(await sb.from('itens').insert(add));return true},
 async salvarCotacao(d){for(const c of d.cotacoes){const r=ok(await sb.from('itens').update({unitario:c.unitario}).eq('id',c.id).select('id'));if(!r.length)throw new Error('Sem permissão para cotar.')}return true},
 async listarUsuarios(){return ok(await sb.from('profiles').select('*').order('nome')).map(p=>({id:p.id,nome:p.nome,login:p.login,setor:p.setor,tipoServico:p.tipo_servico,papel:p.papel,ativo:p.ativo}))},
 async cadastrarUsuario(d){ok(await sb.rpc('criar_usuario',{p_nome:d.nome,p_login:d.login.trim(),p_senha:d.senha,p_setor:d.setor,p_tipo:d.tipoServico||''}));return true},
 async atualizarPermissoes(d){const r=ok(await sb.from('profiles').update({setor:d.setor,tipo_servico:d.setor==='Operação'?d.tipoServico:'',papel:d.setor==='Administração'?'admin':'usuario',ativo:d.ativo!==false}).eq('id',d.id).select('id'));
  if(!r.length)throw new Error('Sem permissão para esta operação.');return true}
};
async function apiRaw(a,d){return H[a](d||{})}
const go=fn=>fn().catch(e=>alert(e.message));

const V={};
V.login=async()=>`<div class="card lg"><h2>Entrar na Conta</h2><form onsubmit="return doLogin(event)"><label>Usuário</label><input id="lu" required><label>Senha</label><input id="lp" type="password" required><button class="btn" style="width:100%;margin-top:1rem" id="lb">Entrar</button></form></div>`;
function doLogin(e){e.preventDefault();$('lb').textContent='Entrando...';go(async()=>{try{U=await api('login',{login:$('lu').value,senha:$('lp').value});localStorage.setItem('u',JSON.stringify(U));location.hash='#'+DEF();render()}finally{if($('lb'))$('lb').textContent='Entrar'}});return false}

V.home=async()=>{let h=`<div class="ph"><h1>Olá, ${esc(U.nome)}</h1></div>`;
 if(can('orcamentos')){const l=await api('listarOrcamentos'),c=s=>l.filter(o=>o.status===s).length;
 h+='<div class="grid">'+[['Total',l.length],['Pendentes',c('Pendente')],['Aprovados',c('Aprovado')],['Rejeitados',c('Rejeitado')],['Aguardando cotação',l.filter(o=>o.pend).length]].map(x=>`<div class="card"><span class="m">${x[0]}</span><b style="font-size:2rem;display:block;color:#2c3e50">${x[1]}</b></div>`).join('')+'</div>'}
 return h};

let L=[];
const rows=()=>{const g=i=>($(i)||{}).value||'';return L.filter(o=>(!g('fs')||o.tipoServico===g('fs'))&&(!g('fv')||o.veiculo===g('fv'))&&(!g('ft')||o.status===g('ft'))).map(o=>`<tr><td><a href="#ver/${o.id}" style="color:#3498db;font-weight:700;text-decoration:none">#${esc(o.id)}</a></td><td>${esc(o.tipoServico)}</td><td>${esc(o.veiculo)}</td>
<td>${brl(o.total)}${o.pend?`<br><span class="badge sc">${o.pend} sem cotação</span>`:''}</td><td>${bd(o.status)}</td><td>${o.status==='Pendente'?`${can('dimensionar')?`<a class="btn sm az" href="#dim/${o.id}">Dimensionar</a> `:''}${o.pend&&can('suprimentos')?`<a class="btn sm" href="#sup/${o.id}">Cotar</a> `:''}${VAL()&&!o.pend&&o.total>0?`<button class="btn sm vd" onclick="st('${o.id}','Aprovado')">Aprovar</button> `:''}${VAL()?`<button class="btn sm vm" onclick="st('${o.id}','Rejeitado')">Rejeitar</button>`:''}`:'<span class="m">Finalizado</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="m">Nenhum orçamento.</td></tr>'};
const dl=()=>$('tb').innerHTML=rows();
const st=(id,s)=>confirm((s==='Aprovado'?'Aprovar':'Rejeitar')+' este orçamento? Depois disso ele não poderá mais ser alterado.')&&go(async()=>{await api('atualizarStatus',{id,status:s});render()});
V.orc=async()=>{L=await api('listarOrcamentos');return `<div class="ph"><h1>Orçamentos</h1>${can('novo')?'<a class="btn az" href="#novo">+ Novo Orçamento</a>':''}</div>
<div class="card"><div class="grid"><div><label>Tipo de serviço</label><select id="fs" onchange="dl()">${opts(TIPOS,'Todos')}</select></div><div><label>Veículo</label><select id="fv" onchange="dl()">${opts(VEI,'Todos')}</select></div>
<div><label>Status</label><select id="ft" onchange="dl()"><option value="">Todos</option><option>Aprovado</option><option>Pendente</option><option>Rejeitado</option></select></div></div></div>
<div class="tc"><table><thead><tr><th>Nº</th><th>Tipo de serviço</th><th>Veículo</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tb">${rows()}</tbody></table></div>`};

V.novo=async()=>{const op=U.papel!=='admin'&&U.setor==='Operação';
 return `<div class="ph"><h1>Novo Orçamento</h1><a href="#orc">&larr; Voltar</a></div><form class="card" onsubmit="return svNovo(event)"><label>Veículo *</label><select id="nv" required>${opts(VEI,'Selecione...')}</select>
<label>Tipo de serviço *</label>${op?`<input id="nt" value="${esc(U.tipoServico||'(não definido - fale com o administrador)')}" readonly>`:`<select id="nt" required>${opts(TIPOS,'Selecione...')}</select>`}
<label>Descrição da Avaria *</label><textarea id="nd" required placeholder="Descreva a avaria..."></textarea>
<div class="acts"><a class="btn cz" href="#orc">Cancelar</a><button class="btn">Salvar Orçamento</button></div></form>`};
function svNovo(e){e.preventDefault();go(async()=>{const r=await api('salvarOrcamento',{veiculo:$('nv').value,tipoServico:$('nt').value,descricao:$('nd').value});alert('Orçamento #'+r.id+' criado.');location.hash=can('dimensionar')?'#dim/'+r.id:'#orc'});return false}

const catB=c=>`<span class="badge ${c==='Hora'?'ok':c==='Sem cadastro'?'pu':'Aprovado'}">${esc(c||'Material')}</span>`;
V.ver=async id=>{if(!id){location.hash='#orc';return ''}const r=await api('getOrcamento',{id}),o=r.orcamento;let t=0;
 const pend=r.itens.filter(x=>!x.cotado).length,P=o.status==='Pendente';
 const b=r.itens.map(x=>{const s=x.cotado?x.qtd*x.unitario:0;t+=s;return `<tr><td>${esc(x.descricao)}</td><td>${catB(x.categoria)}</td><td>${x.qtd}</td><td>${x.cotado?brl(x.unitario):'<span class="m">aguardando cotação</span>'}</td><td>${x.cotado?brl(s):'-'}</td></tr>`}).join('')||'<tr><td colspan="5" class="m">Orçamento ainda não dimensionado.</td></tr>';
 return `<div class="ph"><h1>Orçamento #${esc(o.id)} ${bd(o.status)}</h1><a href="#orc">&larr; Voltar para a lista</a></div>
<div class="card"><div class="grid"><div><span class="m">Veículo</span><br><b>${esc(o.veiculo)}</b></div><div><span class="m">Tipo de serviço</span><br><b>${esc(o.tipoServico)}</b></div><div><span class="m">Solicitante</span><br><b>${esc(o.solicitante)}</b></div></div>
<label>Descrição da avaria</label><div>${esc(o.descricao)}</div></div>
<div class="tc"><table><thead><tr><th>Item</th><th>Categoria</th><th>Qtd</th><th>Valor unit.</th><th>Subtotal</th></tr></thead><tbody>${b}</tbody></table></div>
<div class="tot">Total: <b>${brl(t)}</b>${pend?` <span class="badge sc">${pend} item(ns) sem cotação</span>`:''}</div>
<div class="acts">${P&&can('dimensionar')?`<a class="btn az" href="#dim/${esc(o.id)}">Dimensionar</a>`:''}${P&&pend&&can('suprimentos')?`<a class="btn" href="#sup/${esc(o.id)}">Cotar</a>`:''}${P&&VAL()&&!pend&&t>0?`<button class="btn vd" onclick="st('${esc(o.id)}','Aprovado')">Aprovar</button>`:''}${P&&VAL()?`<button class="btn vm" onclick="st('${esc(o.id)}','Rejeitado')">Rejeitar</button>`:''}</div>
${P?'':'<p class="m" style="text-align:right;margin-top:.6rem">Orçamento finalizado: não pode mais ser alterado.</p>'}`};

let I=[],M=[],OID='';
const mats=()=>M.filter(m=>m.tipo==='Material'),hrs=t=>M.filter(m=>m.tipo===t);
const hOpts=t=>hrs(t).map(m=>`<option value="${m.id}">${esc(m.nome)} - ${brl(m.valor)}/h</option>`).join('')||'<option value="">Nenhum cadastrado</option>';
const itH=()=>{let t=0;const b=I.map((x,i)=>{const s=x.cotado?x.qtd*x.unitario:0;t+=s;return `<tr><td>${esc(x.descricao)}</td><td>${catB(x.categoria)}</td><td>${x.qtd}</td><td>${x.cotado?brl(x.unitario):'<span class="m">aguardando cotação</span>'}</td><td>${x.cotado?brl(s):'-'}</td><td><button class="btn sm vm" onclick="I.splice(${i},1);rd()">X</button></td></tr>`}).join('')||'<tr><td colspan="6" class="m">Nenhum item.</td></tr>';
 return `<div class="tc"><table><thead><tr><th>Item</th><th>Categoria</th><th>Qtd</th><th>Unit.</th><th>Subtotal</th><th></th></tr></thead><tbody>${b}</tbody></table></div><div class="tot">Total precificado: <b>${brl(t)}</b></div>`};
const rd=()=>$('it').innerHTML=itH();
function hFill(){$('he').innerHTML=hOpts($('ht').value);hPrev()}
function hCalc(){const m=M.find(x=>x.id==$('he').value),q=+$('hq').value;if(!m||!(q>0))return null;const min=$('hu').value==='h'?q*60:q;return{m,min,val:Math.round(m.valor/60*min*100)/100}}
function hPrev(){const c=hCalc();$('hp').textContent=c?`${brl(c.val)}  (${brl(c.m.valor)}/h ÷ 60 × ${+c.min.toFixed(2)} min)`:'-'}
function addH(){const c=hCalc();if(!c)return alert('Selecione a especialidade e informe o tempo.');const t=c.min>=60&&c.min%60===0?c.min/60+' h':+c.min.toFixed(2)+' min';
 I.push({origem:'Cadastrado',categoria:'Hora',descricao:`${c.m.tipo} - ${c.m.nome}: ${t} (${brl(c.m.valor)}/h)`,qtd:1,unitario:c.val,cotado:true});rd()}
function addC(){const m=mats()[$('dc').value],q=+$('dq').value;if(!m||!(q>0))return alert('Selecione o material e a quantidade.');I.push({origem:'Cadastrado',categoria:'Material',descricao:m.nome+' ('+m.unidade+')',qtd:q,unitario:m.valor,cotado:true});rd()}
function addA(){const d=$('ad').value.trim(),q=+$('aq').value;if(!d||!(q>0))return alert('Informe descrição e quantidade.');I.push({origem:'Sem cadastro',categoria:'Sem cadastro',descricao:d,qtd:q,unitario:0,cotado:false});$('ad').value='';rd()}
const svIt=()=>go(async()=>{await api('salvarItens',{id:OID,itens:I});alert('Salvo!');location.hash='#orc'});
V.dim=async id=>{if(!id){location.hash='#orc';return ''}OID=id;const [mm,r]=await Promise.all([api('listarMateriais'),api('getOrcamento',{id})]);M=mm;const o=r.orcamento;I=r.itens;
 if(o.status!=='Pendente')return `<div class="ph"><h1>Dimensionar #${esc(id)}</h1><a href="#orc">&larr; Voltar</a></div><div class="card">Este orçamento já foi ${o.status==='Aprovado'?'aprovado':'rejeitado'} e não pode mais ser alterado.</div>`;
 setTimeout(hPrev,0);
 return `<div class="ph"><h1>Dimensionar #${esc(id)}</h1><a href="#orc">&larr; Voltar</a></div><div class="card"><b>${esc(o.veiculo)}</b> · ${esc(o.tipoServico)}<br><span class="m">${esc(o.descricao)}</span></div>
<div class="card"><h2>1. Horas técnicas (interna ou externa)</h2><div class="grid"><div><label>Tipo de hora</label><select id="ht" onchange="hFill()"><option>Hora Interna</option><option>Hora Externa</option></select></div>
<div><label>Especialidade</label><select id="he" onchange="hPrev()">${hOpts('Hora Interna')}</select></div><div><label>Tempo</label><input id="hq" type="number" min="0.01" step="0.01" value="1" oninput="hPrev()"></div>
<div><label>Unidade</label><select id="hu" onchange="hPrev()"><option value="h">Horas</option><option value="m">Minutos</option></select></div><button class="btn az" onclick="addH()">+ Adicionar hora</button></div>
<p class="m" style="margin-top:.7rem">Valor calculado: <b id="hp">-</b></p></div>
<div class="card"><h2>2. Materiais cadastrados</h2><div class="grid"><div><label>Material</label><select id="dc">${mats().map((m,i)=>`<option value="${i}">${esc(m.nome)} (${esc(m.unidade)}) - ${brl(m.valor)}</option>`).join('')||'<option value="">Nenhum cadastrado</option>'}</select></div><div><label>Quantidade</label><input id="dq" type="number" min="0.01" step="0.01" value="1"></div><button class="btn az" onclick="addC()">+ Adicionar material</button></div></div>
<div class="card"><h2>3. Produtos sem cadastro</h2><div class="grid"><div><label>Descrição</label><input id="ad"></div><div><label>Qtd</label><input id="aq" type="number" min="1" value="1"></div><button class="btn" onclick="addA()">+ Sem cadastro</button></div><p class="m" style="margin-top:.7rem">O valor é informado depois pelo setor de Suprimentos.</p></div>
<div id="it">${itH()}</div><div class="acts"><a class="btn cz" href="#orc">Cancelar</a><button class="btn vd" onclick="svIt()">Salvar Dimensionamento</button></div>`};

const calc=()=>{let t=0;document.querySelectorAll('[data-i]').forEach(r=>{const s=(+r.querySelector('input').value||0)*r.dataset.q;r.querySelector('.s').textContent=brl(s);t+=s});$('tt').textContent=brl(t)};
const svCot=id=>go(async()=>{const c=[...document.querySelectorAll('[data-i]')].map(r=>({id:r.dataset.i,unitario:+r.querySelector('input').value}));
 if(c.some(x=>!(x.unitario>0)))return alert('Informe a cotação de todos os itens.');await api('salvarCotacao',{id,cotacoes:c});alert('Cotação enviada!');location.hash='#orc'});
V.sup=async id=>{if(!id){const l=(await api('listarOrcamentos')).filter(o=>o.pend>0&&o.status==='Pendente');
 return `<div class="ph"><h1>Suprimentos</h1></div><div class="tc"><table><thead><tr><th>Nº</th><th>Veículo</th><th>Itens pendentes</th><th></th></tr></thead><tbody>${l.map(o=>`<tr><td>#${esc(o.id)}</td><td>${esc(o.veiculo)}</td><td>${o.pend}</td><td><a class="btn sm az" href="#sup/${o.id}">Cotar</a></td></tr>`).join('')||'<tr><td colspan="4" class="m">Nada pendente.</td></tr>'}</tbody></table></div>`}
 const r=await api('getOrcamento',{id}),p=r.itens.filter(x=>!x.cotado);
 if(r.orcamento.status!=='Pendente')return '<div class="card">Este orçamento já foi finalizado e não pode mais ser alterado.</div>';
 return `<div class="ph"><h1>Cotar Materiais Sem Cadastro - #${esc(id)}</h1><a href="#orc">&larr; Voltar</a></div><div class="card"><b>${esc(r.orcamento.veiculo)}</b> · ${esc(r.orcamento.tipoServico)} · ${esc(r.orcamento.solicitante)}</div>
<div class="tc"><table><thead><tr><th>Item</th><th>Qtd</th><th>Cotação Unit. (R$)</th><th>Subtotal</th></tr></thead><tbody>${p.map(x=>`<tr data-i="${x.id}" data-q="${x.qtd}"><td>${esc(x.descricao)}</td><td>${x.qtd}</td><td><input type="number" step="0.01" min="0" oninput="calc()"></td><td class="s">R$ 0,00</td></tr>`).join('')||'<tr><td colspan="4" class="m">Sem itens pendentes.</td></tr>'}</tbody></table></div>
<div class="tot">Total cotado: <b id="tt">R$ 0,00</b></div><div class="acts"><a class="btn cz" href="#orc">Cancelar</a><button class="btn" onclick="svCot('${esc(id)}')">Confirmar & Enviar Cotação</button></div>`};

const tpC=()=>{$('mu').disabled=$('mt').value!=='Material'};
const delM=id=>confirm('Excluir?')&&go(async()=>{await api('excluirMaterial',{id});render()});
function svMat(e){e.preventDefault();go(async()=>{await api('salvarMaterial',{tipo:$('mt').value,nome:$('mn').value,unidade:$('mt').value==='Material'?$('mu').value:'hora',valor:+$('mv').value});render()});return false}
V.mat=async()=>{const l=await api('listarMateriais');
 return `<div class="ph"><h1>Materiais & Horas</h1></div><form class="card" onsubmit="return svMat(event)"><div class="grid"><div><label>Tipo</label><select id="mt" onchange="tpC()"><option>Material</option><option>Hora Interna</option><option>Hora Externa</option></select></div>
<div><label>Nome / Especialidade</label><input id="mn" required></div><div><label>Fracionamento</label><select id="mu">${opts(['Litro (L)','Mililitro (ml)','Metro (m)','Quilo (kg)','Unidade (un)','Caixa (cx)'])}</select></div>
<div><label>Valor (R$)</label><input id="mv" type="number" step="0.01" min="0" required></div><button class="btn">+ Cadastrar</button></div></form>
<div class="tc"><table><thead><tr><th>Tipo</th><th>Nome</th><th>Fracionamento</th><th>Valor</th><th></th></tr></thead><tbody>${l.map(m=>`<tr><td><span class="badge ${m.tipo==='Material'?'sc':'ok'}">${esc(m.tipo)}</span></td><td>${esc(m.nome)}</td><td>${esc(m.unidade)}</td><td>${brl(m.valor)}</td><td><button class="btn sm vm" onclick="delM('${m.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5" class="m">Nada cadastrado.</td></tr>'}</tbody></table></div>`};

const tg=i=>{if(i==='')$('ut').disabled=$('us').value!=='Operação';else $('t'+i).disabled=$('s'+i).value!=='Operação'};
const upU=id=>go(async()=>{await api('atualizarPermissoes',{id,setor:$('s'+id).value,tipoServico:$('t'+id).value,ativo:$('a'+id).value==='1'});alert('Usuário atualizado.');render()});
function svUsu(e){e.preventDefault();go(async()=>{await api('cadastrarUsuario',{nome:$('un').value,login:$('ul').value,senha:$('up').value,setor:$('us').value,tipoServico:$('ut').value});render()});return false}
V.usu=async()=>{const l=await api('listarUsuarios');
 return `<div class="ph"><h1>Gestão de Usuários</h1></div>
<div class="card m"><b>Regras por setor:</b> <b>Operação</b>: só a tela Orçamentos (solicita e vê os do seu tipo de serviço) · <b>Manutenção</b>: só Orçamentos, dimensiona · <b>Suprimentos</b>: só a tela Suprimentos (informa valores das peças sem cadastro) · <b>Líder</b>: só Orçamentos, com autonomia para ver, dimensionar, aprovar e rejeitar · <b>Administração</b>: tudo, incluindo Materiais &amp; Horas e Usuários. Orçamentos aprovados ou rejeitados não podem mais ser alterados.</div>
<form class="card" onsubmit="return svUsu(event)"><h2>Cadastrar usuário</h2><div class="grid"><div><label>Nome</label><input id="un" required></div><div><label>Login</label><input id="ul" required></div>
<div><label>Senha (mín. 6)</label><input id="up" type="password" minlength="6" required></div><div><label>Setor</label><select id="us" onchange="tg('')">${opts(SET)}</select></div>
<div><label>Tipo de serviço (Operação)</label><select id="ut" disabled>${opts(TIPOS)}</select></div></div><div class="acts"><button class="btn">+ Cadastrar</button></div></form>
<div class="tc"><table><thead><tr><th>Nome / Login</th><th>Setor</th><th>Tipo de serviço</th><th>Ativo</th><th></th></tr></thead><tbody>${l.map(u=>`<tr><td><b>${esc(u.nome)}</b><br><span class="m">${esc(u.login)}</span></td>
<td><select id="s${u.id}" onchange="tg('${u.id}')">${SET.map(x=>`<option ${u.setor===x?'selected':''}>${x}</option>`).join('')}</select></td>
<td><select id="t${u.id}" ${u.setor!=='Operação'?'disabled':''}>${TIPOS.map(x=>`<option ${u.tipoServico===x?'selected':''}>${x}</option>`).join('')}</select></td>
<td><select id="a${u.id}"><option value="1" ${u.ativo?'selected':''}>Sim</option><option value="0" ${!u.ativo?'selected':''}>Não</option></select></td><td>${u.login==='ADM'?'':`<button class="btn sm vd" onclick="upU('${u.id}')">Salvar</button>`}</td></tr>`).join('')}</tbody></table></div>`};

async function render(){
  if(U&&!booted)await boot();
  const [r0,arg]=(location.hash.slice(1)||(U?DEF():'home')).split('/'),r=r0||'home';
  const nl=U?(U.papel==='admin'?['home',...Object.keys(PG)]:(NAVS[U.setor]||[])):[];
  $('nav').innerHTML=U?nl.map(k=>`<a href="#${k}" class="${r===k||(k==='orc'&&['ver','dim'].includes(r))?'on':''}">${k==='home'?'Início':PG[k][1]}</a>`).join('')+`<a onclick="logout()">Sair (${esc(U.nome)})</a>`:'';
  if(!U){$('app').innerHTML=await V.login();return}
  const need={orc:'orcamentos',ver:'orcamentos',novo:'novo',dim:'dimensionar',sup:'suprimentos',mat:'materiais',usu:'usuarios'}[r];
  if(U&&r==='home'&&U.papel!=='admin'){location.hash='#'+DEF();return}
  if(!V[r]||(need&&!can(need))||!allowed(r)){$('app').innerHTML='<div class="card">Página não encontrada ou sem permissão.</div>';return}
  $('app').innerHTML='<div class="m">Carregando...</div>';
  try{$('app').innerHTML=await V[r](arg)}catch(e){$('app').innerHTML=`<div class="card"><b style="color:#e74c3c">Erro:</b> ${esc(e.message)}</div>`}
}
window.addEventListener('hashchange',render);render();
</script></body></html>
